<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smaug Studios on Discord</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="hero"><div class="wrap">
    <img class="hero-logo" src="../assets/logo.png" alt="Smaug Studios logo">
    <h1>Find us on Discord</h1>
    <p class="lead">Add us on Discord with this username:</p>
    <div class="actions">
      <code id="handle" style="font-size:20px;padding:10px 16px">smaugstudios_39262</code>
      <button class="btn btn-gold" id="copy" type="button" style="border:0;cursor:pointer">Copy username</button>
    </div>
    <div class="actions"><a class="btn btn-ghost" href="https://discord.com/app" rel="noopener">Open Discord</a><a class="btn btn-ghost" href="../">Back to home</a></div>
  </div></main>
  <script>
    document.getElementById('copy').addEventListener('click', function () {
      var b = this;
      navigator.clipboard.writeText('smaugstudios_39262').then(function () {
        b.textContent = 'Copied!';
        setTimeout(function () { b.textContent = 'Copy username'; }, 1500);
      }, function () { b.textContent = 'Copy failed: select the text'; });
    });
  </script>
</body>
</html>
